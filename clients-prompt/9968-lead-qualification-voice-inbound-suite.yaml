  name: '[Template] Voice — Lead qualification inbound'
  slug: lead-qualification-voice-inbound
  tipo: Vocale
  ambiente: Playground
  link_spoki: https://app.spoki.com/ai/agent/838ae850-3531-4c66-b895-6eca1b0e8d66
  test_copy: true
  test_contact: '+393349173929'
  voice_automation: '567663'
prompt:
  sync_date: '2026-09-17'
  repo_path: clients-prompt/9968-lead-qualification-voice-inbound.md
