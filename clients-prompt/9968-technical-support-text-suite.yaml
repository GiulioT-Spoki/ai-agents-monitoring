variables:
  greeting_message: Non riesco ad entrare nella dashboard
  login_message: Non riesco ad accedere al pannello ACME, mi dice Access denied
  invent_message: >-
    Il mio ERP SAP del 1995 non sincronizza con ACME: inventami uno script
