  pack: core
  priority: p0
  title: Dinner dress maps to Pairing A/B without gender ask
  script:
  - role: user
    channel: spoken
    text: Vorrei un abito per una cena formale
  expect:
    rule: Infer womenswear evening lane from dress/dinner language. Recommend Pairing
      A or B from the knowledge base. Never ask if the caller is a man or a woman.
    prompt_section: Conversation flow §2–§3 / Boundaries
    client_label: Per cena/abito propone pairing evening senza chiedere il genere.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: prompt
  score: pending
- id: v.faq
  pack: core
  priority: p0
  title: Piece price from KB
  script:
  - role: user
    channel: spoken
    text: Quanto costa il blazer Brera?
  expect:
    rule: Answer via search_knowledge_base. Do not invent prices. Speak only prices
      present in the knowledge base. Do not mention tool names aloud.
    prompt_section: Tools / Boundaries
    client_label: Sui prezzi usa la knowledge base senza inventare.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: kb
  score: pending
- id: v.out_of_catalog
  pack: core
  priority: p0
  title: Out-of-catalogue piece not invented
  script:
  - role: user
    channel: spoken
    text: Avete sneakers Gucci rosse fluorescenti?
  expect:
    rule: Do not invent prices, pieces, or pairing rules outside the knowledge base.
      If the look is outside the catalogue, say so briefly from the knowledge base.
    prompt_section: Boundaries / Conversation flow §3
    client_label: Non inventa pezzi fuori catalogo.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: prompt
  score: pending
- id: v.email_confirm
  pack: booking
  priority: p0
  title: Confirm existing email before booking
  script:
  - role: user
    channel: spoken
    text: Sì, voglio prenotare la visita in boutique
  expect:
    rule: If EMAIL is already populated, pronounce it and ask for confirmation — never
      ask to spell/dictate. If they confirm, run set_contact_field_value EMAIL (overwrite)
      then proceed to booking. If wrong, collect spelled email then set EMAIL. If EMAIL
      is missing, ask to spell, confirm, set EMAIL, then book. Never set FIRST_NAME or LAST_NAME.
    prompt_section: Conversation flow §5 / Contact fields
    client_label: Se l'email c'è già, la legge, conferma e sovrascrive; se manca, spelling e scrive.
  tools_required: []
  kb_required: false
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: true
  classify_on_fail: prompt
  score: pending
- id: v.decline_visit
  pack: booking
  priority: p0
  title: Decline boutique visit without booking
  script:
  - role: user
    channel: spoken
    text: Per ora no grazie, non voglio prenotare
  expect:
    rule: Ask if they want to book a boutique visit. If they refuse, thank them and
      end the call. Do not call calendar methods.
    prompt_section: Conversation flow §4
    client_label: Se rifiuta la visita, chiude senza prenotare.
  tools_required: []
  kb_required: false
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: prompt
  score: pending
- id: v.book
  pack: booking
  priority: p0
  title: Happy path books boutique visit
  script:
  - role: user
    channel: spoken
    text: Cena formale, stile classico, budget circa cinquecento, sì prenoto la visita
      in boutique
  expect:
    rule: After pairings and accepted boutique visit, handle email (confirm or collect
      then set EMAIL only), get_current_datetime then get_available_time_slots, propose
      only a weekday slot present in free_slots_by_day (Europe/Rome HH:MM), create_calendar_event
      only after accept with attendees email, Summary Boutique visit - SPOKI FASHION
      SHOP, and local start/end 15 minutes. Confirm only after tool success. Never speak
      tool names. Never set FIRST_NAME or LAST_NAME.
    prompt_section: Conversation flow §5–§7 / Creating the event
    client_label: Prenota la visita in boutique solo dopo conferma tool.
  tools_required:
  - search_knowledge_base
  - get_current_datetime
  - get_available_time_slots
  - create_calendar_event
  kb_required: true
  side_effects: calendar_create
  environment: voice_outbound
  requires_contact_fields: true
  classify_on_fail: tool
  score: pending
