scenarios:
- id: v.greeting
  pack: core
  priority: p0
  title: No second greeting; no name ask; clarify occasion
  script:
  - role: user
    channel: spoken
    text: Cerco un look per una cena formale
  expect:
    rule: The first message already greeted the caller. Start from their answer.
      Do not greet again. Do not ask for FIRST_NAME. Clarify occasion or ask one style
      question. One question at a time. Max 2-3 sentences.
    prompt_section: Conversation flow §1 / Customer data / Tone
    client_label: Dopo il first message non risaluta, non chiede il nome, una domanda alla volta.
  tools_required: []
  kb_required: false
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: prompt
  score: pending
- id: v.style
  pack: core
  priority: p0
  title: Style intake then KB pairings
  script:
  - role: user
    channel: spoken
    text: Cena formale, vorrei un abito, stile classico, budget circa cinquecento euro
  expect:
    rule: Ask discovery questions one at a time if needed (occasion, silhouette, style,
      soft budget). Never ask if they are a man or a woman. Then search_knowledge_base
      and recommend one or two pairings matching the inferred lane from the knowledge
      base only. Ask short feedback then offer boutique visit.
    prompt_section: Conversation flow §2–§4
    client_label: Consiglia abbinamenti allineati al lane, senza chiedere il genere.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: kb
  score: pending
- id: v.lane_menswear
