schema_version: 1
agent:
  account_id: '9968'
  cliente: Spoki Demo Vendita — SPOKI FASHION SHOP
  name: VOICE - WEBINAR 14/10/26
  slug: fashion-styling-voice-inbound
  tipo: Vocale
  ambiente: Playground
  link_spoki: https://app.spoki.com/ai/agent/58ef6461-6304-40bb-88c8-1cc16066481a
  test_copy: true
  test_contact: '+393349173929'
prompt:
  sync_date: '2026-10-01'
  repo_path: clients-prompt/9968-fashion-styling-voice-inbound.md
