  priority: p0
  title: Office completo maps to Pairing C without gender ask
  script:
  - role: user
    channel: spoken
    text: Cerco un completo per l'ufficio, business casual
  expect:
    rule: Infer menswear or day-tailored lane from completo/office language. Recommend
      Pairing C (or its pieces) from the knowledge base. Never ask if the caller is a
      man or a woman.
    prompt_section: Conversation flow §2–§3 / Boundaries
    client_label: Per ufficio/completo propone look sartoriale senza chiedere il genere.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: voice_outbound
  requires_contact_fields: false
  classify_on_fail: prompt
  score: pending
