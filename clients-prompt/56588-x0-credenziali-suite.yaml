scenarios:
- id: x0.l1
  pack: voice
  priority: p0
  title: Avvio chiamata
  script:
  - role: user
    channel: spoken
    text: '[silenzio — nuova chiamata, non parlare]'
  expect:
    rule: 'All''avvio, PRIMA di qualsiasi domanda, chiama xLogin. Se ok=true e c''è
      token: salvalo in %%RIPORTAL_JWT%%. Di'' solo: Login ok. Non mostrare il JWT.
      Non chiedere targa/dati prima del login.'
    prompt_section: LOGIN
    client_label: All'avvio della chiamata l'assistente fa il login interno e dice
      solo Login ok, senza leggere il token.
  tools_required:
  - xLogin
  kb_required: false
  side_effects: none
  environment: voice_outbound
  classify_on_fail: tool
  score: pending
  client_outcome: pending
  notes: 'Stessa chiamata per D1–V1 dopo L1 ok. Sync prompt v2 pendente in Spoki.
    Playground vocale senza contatto: %%RIPORTAL_JWT%% non si valorizza. Eseguire
    via automazione Spoki Voice.'
  requires_contact_fields: true
- id: x0.d1
  pack: voice
  priority: p0
  title: Raccolta cinque campi
  script:
  - role: user
    channel: spoken
    text: AB 123 CD
  - role: user
    channel: spoken
    text: il ventinove luglio duemilaventisei
  - role: user
    channel: spoken
    text: '3331234567'
  - role: user
    channel: spoken
    text: mario punto rossi chiocciola example punto com
  - role: user
    channel: spoken
    text: Sì, do il consenso
  expect:
    rule: una domanda per volta, frasi brevi; raccogli i dati SENZA ripeterli dopo
      ogni risposta; targa 2 lettere 3 numeri 2 lettere; data naturale a voce NON
      YYYY-MM-DD; cellulare; email; privacy. massimo due richieste per lo stesso dato.
    prompt_section: FLUSSO NORMALE
    client_label: L'assistente raccoglie targa, data, telefono, email e privacy una
      domanda alla volta, senza ripetere i dati.
  tools_required:
  - get_current_datetime
  kb_required: false
  side_effects: none
  environment: voice_outbound
  classify_on_fail: prompt
  score: pending
  client_outcome: pending
  notes: suite-run --turn 0..4 sulla stessa chiamata dopo x0.l1 Pass. Atteso save
    AB123CD / 2026-07-29. Serve contatto di test per verificare i valori salvati.
  requires_contact_fields: true
- id: x0.c1
  pack: voice
  priority: p0
  title: Conferma unica e verifica duplicato
  script:
  - role: user
    channel: spoken
    text: Sì, confermo
  expect:
    rule: Dopo aver raccolto tutti i dati e la privacy, PRIMA di qualsiasi webhook,
      riepiloga UNA volta sola in forma umana e chiedi Confermi? Dopo conferma, di'
      solo Verifico se esiste già una pratica. Poi chiama xVerificaDuplicato. A voce
      non leggere il JSON, non citare nomi di campo, di variabile o di tool.
    prompt_section: CONFERMA DATI
    client_label: Prima dei webhook l'assistente fa un solo riepilogo umano e poi
      verifica se la pratica esiste già.
  tools_required:
  - xVerificaDuplicato
  kb_required: false
  side_effects: none
  environment: voice_outbound
  classify_on_fail: tool
  score: pending
  client_outcome: pending
  requires_contact_fields: true
- id: x0.v1
  pack: voice
  priority: p0
  title: Create e chiusura
  script:
  - role: user
    channel: spoken
    text: '[attendi esito xVerificaDuplicato — non parlare se l''agente procede da
      solo]'
  expect:
    rule: 'Se Nessun Incarico presente: Non risulta una pratica aperta. Procedo con
      la creazione. Poi chiama xCreaPratica. Id numerico → Pratica creata. Il tuo
      riferimento è [solo le cifre]. Poi esatto Ora passiamo alla gestione del danno.
      Nessun JSON letto a voce, nessuna richiesta di conferma JSON.'
    prompt_section: STEP 2
    client_label: Se la pratica non esiste, l'assistente la crea, dà solo il riferimento
      numerico e chiude lo step.
  tools_required:
  - xCreaPratica
  kb_required: false
  side_effects: none
  environment: voice_outbound
  classify_on_fail: tool
  score: pending
  client_outcome: pending
  notes: Se duplicato → Skip V1 e score x0.e3/e4. HTTP≥400 o id illeggibile → Skip
    se non iniettabile (platform).
  requires_contact_fields: true
- id: voice.short_turns
