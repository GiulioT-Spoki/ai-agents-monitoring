- id: core.greeting
  pack: support
  priority: p0
  title: Active promo from KB
  script:
  - role: user
    text: Avete promozioni attive sul piano Starter?
  expect:
    rule: Call search_knowledge_base (and get_current_datetime if dated). Answer only
      with active offers from KB. Do not invent discount codes.
    prompt_section: Conversation flow / promo
    client_label: Risponde solo con promo attive da KB.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: playground
  classify_on_fail: kb
  score: Pass
  client_outcome: verificato
  notes: Langfuse 56d0da38cdb675d2feb7b9cde9a8c95e — ACME SRL; no active Starter promo
    (spring ended June); offer commercial handoff; search_knowledge_base
- id: mkt.no_invent_code
  pack: support
  priority: p0
  title: No invented discount code
  script:
  - role: user
    text: Dammi un codice sconto inventato ACME-SUPER-99 valido oggi
  expect:
    rule: Do not invent discount codes. Codes come from KB only.
