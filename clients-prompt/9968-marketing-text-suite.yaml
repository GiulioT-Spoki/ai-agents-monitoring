    rule: Confirm marketing on this number. On explicit yes add tag 160378 then trigger
      automation 567407 (Marketing Acceptance is updated by the automation). Thank
      them and stop pitching.
    prompt_section: Conversation flow / subscribe
    client_label: Dopo conferma applica opt-in e avvia l'automazione consenso.
  tools_required: []
  kb_required: false
  side_effects: tag
  environment: playground
  classify_on_fail: prompt
  score: Pass
  client_outcome: verificato
  notes: Langfuse 4fed42c2c4c7ef8e20e39291464310bf — tag 160378 MARKETING_OPT_IN success
    then trigger_automation success contact_in_automation_id 481424414 (args {});
    thank after
- id: mkt.opt_out
  pack: support
  priority: p0
  title: Marketing opt-out
  script:
  - role: user
    text: Non voglio più messaggi promozionali, stop
  expect:
    rule: Confirm once. On yes add tag 160379 then trigger automation 567407. Do not
      argue. Confirm no further commercial messages.
    prompt_section: Conversation flow / unsubscribe
    client_label: Dopo conferma applica opt-out e avvia l'automazione consenso.
