  classify_on_fail: prompt
  score: pass
  client_outcome: pass
  notes: 'Servizio OK da KB; non ha inventato €.'
  requires_contact_fields: false
- id: cg.t1
  pack: support
  priority: p1
  title: Richiesta operatore Workflow
  script:
  - role: user
    text: Mi passa un operatore.
  expect:
    rule: If the caller wants a live person, accept without arguing. Workflow Platform
