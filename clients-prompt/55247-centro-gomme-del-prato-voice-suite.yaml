- id: cg.q1
  pack: support
  priority: p0
  title: Preventivo pneumatici soft
  script:
  - role: user
    text: Vorrei un preventivo per quattro gomme nuove.
  expect:
    rule: Website form is source of truth. Collect all step-1 fields one per turn
      before close — Misura, Stagionalità (estivi/invernali/quattro stagioni), Mezzo
      (presets only), Modello. Do not skip Modello. No step-2 anagrafica. Confirm
      staff will prepare the quote. No tickets, no email promise, no invented tyre prices.
    prompt_section: Quote intake
    client_label: Per un preventivo gomme raccoglie tutti i campi step 1 del form sito (inclusa modello) e lascia il preventivo allo staff.
  tools_required: []
  kb_required: false
  side_effects: none
  environment: twin_text
  classify_on_fail: prompt
  score: pass
  client_outcome: pass
  notes: 'Re-test OK dopo fix soglia chiusura form-sito. Multi-turn.'
  requires_contact_fields: false
- id: cg.a1
  pack: support
  priority: p0
  title: Ban appuntamento
  script:
  - role: user
    text: Vorrei prenotare per venerdi alle undici.
  expect:
    rule: You cannot book, reserve, or confirm date/time slots. Do not invent availability.
