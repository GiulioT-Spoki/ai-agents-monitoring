    client_label: L'assistente non fissa appuntamenti in chiamata.
  tools_required: []
  kb_required: false
  side_effects: none
  environment: twin_text
  classify_on_fail: prompt
  score: pass
  client_outcome: pass
  notes: ''
  requires_contact_fields: false
- id: cg.g1
  pack: support
  priority: p0
  title: Gap sabato
  script:
  - role: user
    text: Aprite il sabato?
  expect:
    rule: Missing KB fact after search_knowledge_base including Saturday/holiday hours.
      Stay on the call. Do not invent. Do not promise that staff will automatically
      call back. Offer a person or quote details.
    prompt_section: Default fallback
    client_label: Se manca l'orario sabato in knowledge base, non inventa e non promette ricontatti automatici.
