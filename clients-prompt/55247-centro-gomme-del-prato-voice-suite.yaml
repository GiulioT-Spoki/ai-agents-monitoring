    text: Fate anche la convergenza e il deposito gomme?
  expect:
    rule: Answer services only with search_knowledge_base. Do not confirm appointments.
    prompt_section: FAQ
    client_label: L'assistente conferma servizi presenti in knowledge base.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: twin_text
  classify_on_fail: kb
  score: pass
  client_outcome: pass
  notes: ''
