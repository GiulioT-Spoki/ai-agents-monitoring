  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: twin_text
  classify_on_fail: prompt
  score: pass
  client_outcome: pass
  notes: 'Soft pass iniziale (inferenza chiusi). Re-test Pass: gap esplicito solo Lun-Ven pubblicati.'
