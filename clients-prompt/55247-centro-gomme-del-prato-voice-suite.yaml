  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: twin_text
  classify_on_fail: kb
  score: pass
  client_outcome: pass
  notes: ''
  requires_contact_fields: false
- id: cg.h2
  pack: support
  priority: p1
  title: Aperti adesso due fasce
  script:
  - role: user
    text: Siete aperti adesso?
  expect:
    rule: get_current_datetime then compare with KB two bands (08:00-12:00 and 14:00-18:30).
      Never say orario continuato. Midday 12:00-14:00 closed. Speak both bands when stating hours.
