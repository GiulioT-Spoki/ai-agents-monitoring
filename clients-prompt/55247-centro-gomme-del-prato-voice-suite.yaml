    client_label: I prezzi listino citati vengono dalla knowledge base.
  tools_required:
  - search_knowledge_base
  kb_required: true
  side_effects: none
  environment: twin_text
  classify_on_fail: kb
  score: pass
  client_outcome: pass
  notes: ''
