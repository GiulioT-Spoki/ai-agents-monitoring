  script:
  - role: user
    text: Quanto costa il cambio gomme stagionale su cerchi da 17?
  expect:
    rule: Speak listino prices from KB only. Prefer one size band per turn. 16-17 pollici
      = 10.00 EUR a gomma. Never invent a price missing from search results.
